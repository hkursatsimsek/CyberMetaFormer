# Stage 2 TimesNet (TSLib; k=1 N/A, top_k=1 at k=4). HPO: d_model, ff, layers, top_k, dropout + shared.
# compile off: inductor cannot compile the complex output of rfft (stride error); the period choice also syncs
# with the CPU in every batch (TSLib FFT_for_Period).
model: timesnet
model_args: {d_model: 32, ff: 64, layers: 2, top_k: 3, kernels: 6, dropout: 0.1}
scale: global
optimizer: adamw
lr: 0.001
weight_decay: 0.01
epochs: 30
batch_size: 1024
schedule: warmup_cosine
warmup_frac: 0.05
early_stopping: {patience: 5}
loss: ce
grad_clip: 1.0
compile: false
eval_batch_size: 8192
