# M3 varyantları. run_grid.py --variants <ad> ile; koşu adı <model>-<ad>_k<k>_s<seed>.
# Her varyant: temel config + HPO'nun en iyisi + bu yama. Anahtarlar:
#   model_args: model kurucusuna yama;  train: üst düzey config yaması (train.py anahtarları);
#   fit: CyberMetaFormer genişliği (d) bu bütçenin üst sınırına yeniden sığdırılır (varsayılan b1; null = HPO'nun d'si).
# Ana model varyant değildir: cybermetaformer_k101_s* (run_grid --models cybermetaformer).

# ── ablasyon çekirdeği (bu Mac) ──
duz78:        {model_args: {tokens: flat, host_mixer: none}}         # host tokenizasyonu yok
host_yok:     {model_args: {host_mixer: none}}                       # RQ4
host_tam:     {model_args: {host_mixer: attn}}                       # topoloji sapması yok
host_gcn:     {model_args: {host_mixer: gcn}}
konv_dikkat:  {model_args: {temporal: [conv, attn]}}                 # SSD yerine nedensel dikkat (tam geçmiş)
hafiza_yok:   {model_args: {temporal: [conv, attn], window: 32, age: false}}   # pencere 32, pencere ötesi bilgi yok
yalniz_yas:   {model_args: {temporal: [conv, attn], window: 32, age: true}}    # pencere 32 + uyarı yaşı (a)
yalniz_ssd:   {model_args: {age: false}}                             # tam geçmiş SSD (c), yaş kanalı yok
konum_yok:    {model_args: {pos: none}}

# ── ablasyon eki (bu Mac) ──
kol_konv:     {model_args: {temporal: [conv]}}                       # yalnız kısa vade (+ yaş)
kol_ssd:      {model_args: {temporal: [ssd]}}                        # yalnız uzun vade
konv_gru:     {model_args: {temporal: [conv, gru]}}
havuz_mlp:    {model_args: {temporal: [pool, mlp]}}                  # MetaFormer'ın basit karıştırıcıları

# ── ölçekleme kontrolü (M4) ──
b2:           {fit: b2}

# ── M4'teki karşılaştırmalar için ana modelin kopyası ──
# Alan genelleme ve (ii), M4'te bu kopyaya karşı (aynı makine) kıyaslanır; ana modelle farkı makineler arası tekrar
# üretilebilirliği de ölçer.
ana_m4:       {}

# ── aksiyon girdisi ablasyonu (M4, 2026-10-23'te taşındı): cybermetaformer ve gru_full ──
aksiyon:      {model_args: {action_input: true}}

# ── alan genelleme ve mekanizma artırması (M4, dg.py): ana_m4'e karşı ──
# Katsayılar DomainBed varsayılanları; OOD'ye göre ayarlanmaz (OOD hiçbir seçime girmez).
dg_groupdro:  {train: {dg: {method: groupdro, eta: 0.01}}}
dg_vrex:      {train: {dg: {method: vrex, lam: 10.0, anneal_steps: 500}}}
dg_coral:     {train: {dg: {method: coral, lam: 1.0}}}
dg_dann:      {train: {dg: {method: dann, lam: 1.0}}}
art_uyari:    {train: {augment: {alert_drop: 0.1}}}          # uyarı koşusu silme (kaçak %5'in iki katı)
art_zaman:    {train: {augment: {time_mask: 0.1}}}           # adım maskeleme

# ── (ii) saldırgan kayması (M4): cybermetaformer, gru_full (HPO asama1), timemixer k=64 (HPO asama2) ──
saldirgan_bline:   {train: {train_red: bline}}
saldirgan_meander: {train: {train_red: meander}}

# ── M4 revizyonu, madde 4: host-token GRU + hostlar arası dikkat referansı ──
# Zaman karıştırıcısı yalnız GRU (konv kolu ve kapı yok); host token'ları, yaş kanalı, gömmeler ve HPO ayarları ana
# modelle aynı. Topoloji sapmalı ve sapmasız iki sürüm; b1'e d=64 ile sığıyor (184 499 / 184 451 parametre). M4 Pro.
gru_host_topo:     {model_args: {temporal: [gru]}}
gru_host_attn:     {model_args: {temporal: [gru], host_mixer: attn}}
