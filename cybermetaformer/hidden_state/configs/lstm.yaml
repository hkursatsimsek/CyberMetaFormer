# Stage 1 LSTM (last hidden state → 12×3). HPO: hidden, layers, dropout + shared.
model: lstm
model_args: {hidden: 128, layers: 1, dropout: 0.0}
scale: global
optimizer: adamw
lr: 0.001
weight_decay: 0.01
epochs: 30
batch_size: 1024
schedule: warmup_cosine
warmup_frac: 0.05
early_stopping: {patience: 5}
loss: ce
grad_clip: 1.0
