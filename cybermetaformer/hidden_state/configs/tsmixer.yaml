# Stage 2 TSMixer (TSLib ResBlocks + classification head). HPO: d_model, layers, dropout + shared.
model: tsmixer
model_args: {d_model: 128, layers: 2, dropout: 0.1}
scale: global
optimizer: adamw
lr: 0.001
weight_decay: 0.01
epochs: 30
batch_size: 1024
schedule: warmup_cosine
warmup_frac: 0.05
early_stopping: {patience: 5}
loss: ce
grad_clip: 1.0
compile: true
