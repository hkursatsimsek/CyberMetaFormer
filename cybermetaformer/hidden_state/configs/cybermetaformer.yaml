# CyberMetaFormer (stage 3): episode mode (full history, prediction at every step), k=101.
# Main variant: host tokens + alert-age channel, temporal mixer causal conv + SSD (gated), topology-biased host
# attention. B1 budget (147–220 thousand). Training settings as in gru_full; HPO in M3 step 4.
model: cybermetaformer
mode: episode
episodes_per_batch: 16
k: 101
model_args:
  d: 64
  layers: 3
  temporal: [conv, ssd]
  host_mixer: topo
  topo_mask: false
  heads: 4
  state: 16
  kernel: 4
  window: null
  mlp_ratio: 3
  dropout: 0.1
  age: true
  pos: learned
  tokens: host
scale: global
optimizer: adamw
lr: 0.001
weight_decay: 0.01
epochs: 30
schedule: warmup_cosine
warmup_frac: 0.05
early_stopping: {patience: 5}
loss: ce
grad_clip: 1.0
eval_batch_size: 16384   # episode mode: 162 episodes/chunk, so the (B·13, heads, 101, 101) tensors fit
