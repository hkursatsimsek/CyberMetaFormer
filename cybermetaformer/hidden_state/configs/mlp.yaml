# Stage 1 MLP base configuration. HPO (hpo.py) changes model_args, lr, weight_decay and class_weights;
# the rest is the final protocol (at most 30 epochs, patience 5, warmup + cosine).
model: mlp
model_args: {hidden: [512, 512], dropout: 0.1}
scale: global
optimizer: adamw
lr: 0.001
weight_decay: 0.01
epochs: 30
batch_size: 1024
schedule: warmup_cosine
warmup_frac: 0.05
early_stopping: {patience: 5}
loss: ce
